[pytest]
testpaths = tests
python_files = test_*_mine.py
addopts = -ra
markers =
    lru: tests for LRUCache
    keys: tests for cachetools.keys
    func: tests for cachetools.func
    datadriven: tests that read their data from CSV files
    boundary: boundary value (BVA) tests
    negative: tests that expect an error
